<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EBE9E5" />
    <script>
      // Match the OS preference before first paint, so a dark session never flashes paper.
      if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <meta
      name="description"
      content="Unhuman Engine (UHE) is an open-source, hand-written C++23 real-time 3D engine for robotics and games: Vulkan RHI, Slang shaders compiled to SPIR-V, entt ECS, Jolt & Box2D physics stepping on the engine clock, ImGui editor, headless rendering."
    />

    <!-- Open Graph / social preview -->
    <meta property="og:title" content="Unhuman Engine — real-time 3D engine for robotics and games" />
    <meta
      property="og:description"
      content="Open-source C++23 real-time 3D engine for robotics and games: Vulkan RHI written by hand, Slang → SPIR-V shaders, entt ECS, Jolt/Box2D physics stepping on the engine clock, ImGui editor, Tracy profiling. Linux first, Windows too. MIT."
    />
    <meta property="og:image" content="https://www.unhumanengine.xyz/logo.png" />
    <meta property="og:url" content="https://www.unhumanengine.xyz/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Unhuman Engine" />
    <meta
      name="twitter:description"
      content="Open-source C++23 real-time 3D engine for robotics and games: Vulkan RHI, Slang shaders, ECS, physics stepping, ImGui editor. Built to be read, not admired."
    />
    <meta name="twitter:image" content="https://www.unhumanengine.xyz/logo.png" />

    <link rel="icon" type="image/png" href="/icon.png" />
    <title>Unhuman Engine — real-time 3D engine for robotics and games</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
